# ProGuard config for SkinMod
# Цель: обфусцировать собственные классы мода, но сохранить всё,
# на что есть ссылки по имени или что нужно для работы рантайма.

# ОБЯЗАТЕЛЬНО: сохраняем аннотации, иначе Forge/Mixin не найдут
# @Mod, @EventBusSubscriber, @Mixin и сломается загрузка мода.
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,SourceFile,Deprecated
# Сохраняем сами аннотации как классы (на всякий случай).
-keep class net.minecraftforge.fml.common.Mod { *; }
-keep class net.minecraftforge.fml.common.Mod$EventBusSubscriber { *; }
-keep class org.spongepowered.asm.mixin.Mixin { *; }

# Не удалять и не переименовывать классы, на которые ссылается
# skinmod.mixins.json по полному имени (пакет + класс).
-keep class com.example.skinmod.client.mixin.** { *; }

# Классы, обнаруживаемые Forge по аннотациям (@Mod, @Mod.EventBusSubscriber).
# Иначе ProGuard сочтёт их неиспользуемыми и удалит.
-keep @net.minecraftforge.fml.common.Mod class *
-keep @net.minecraftforge.fml.common.Mod$EventBusSubscriber class *

# Главный класс мода (на всякий случай, чтобы modid-точка входа была стабильна).
-keep class com.example.skinmod.SkinMod { *; }

# Gson-сериализация ServerSkinManager.SkinData идёт ПО ИМЕНАМ ПОЛЕЙ.
# Если обфусцировать поля — загрузка сохранённых скинов сломается.
-keep class com.example.skinmod.ServerSkinManager$SkinData { *; }
-keepclassmembers class com.example.skinmod.ServerSkinManager$SkinData {
    *;
}

# Сохраняем все ресурсы (refmap, mixins.json, META-INF/mods.toml, LICENSE.txt и т.д.).
# В ProGuard 7.4 ресурсы сохраняются по умолчанию, поэтому отдельной опции не нужно.
-keepdirectories

# Mixin-процессор и refmap завязаны на стабильные имена методов внутри миксинов —
# они уже защищены правилом выше (классы миксинов не трогаем целиком).

# Официальные имена Minecraft резолвятся через libraryjars — не предупреждать.
-ignorewarnings

# Не меняем модификаторы доступа (безопаснее для модов: final/protected могут быть важны).
# (оптимизация оставлена по умолчанию, но без allowaccessmodification)
