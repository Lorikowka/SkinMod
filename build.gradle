plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

mixin {
    add sourceSets.main, "skinmod.refmap.json"
    config "skinmod.mixins.json"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            // Уникальный ник и UUID при каждом запуске runClient. Удобно для тестов
            // мультиплеера между несколькими клиентами на одной машине (каждый
            // запуск ./gradlew runClient получает новое имя, т.к. build.gradle
            // пересчитывается заново).
            def devUuid = java.util.UUID.randomUUID().toString()
            args '--username', "Dev${devUuid.substring(0, 5)}"
            args '--uuid', devUuid
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Добавьте сюда дополнительные репозитории при необходимости
}

configurations {
    proguard
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    proguard 'com.guardsquare:proguard-base:7.4.2'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'skinmod.mixins.json'  // <-- ОБЯЗАТЕЛЬНО
            ])
        }
        // Включаем текст лицензии в jar (требование MIT при распространении)
        from('LICENSE.txt') { into 'META-INF' }
        finalizedBy 'reobfJar'
    }

    // ProGuard-обфускация собственных классов мода (опционально, отдельная задача).
    // Обычный ./gradlew build её не вызывает — чтобы не ломать рабочий релизный jar.
    // Требует интернет при первом запуске (загрузка ProGuard). Итог: build/libs/skinmod-1.0.0-obf.jar
    def obfJar = layout.buildDirectory.file("libs/${mod_id}-${mod_version}-obf.jar")

    tasks.register('obfuscate') {
        dependsOn 'reobfJar'
        doLast {
            // reobfJar переименовывает jar на месте, поэтому reobf-версия лежит
            // по тому же пути, что и выход задачи 'jar' (build/libs/skinmod-<ver>.jar).
            def injar = tasks.named('jar').get().archiveFile.get().asFile
            javaexec {
                classpath = configurations.proguard
                mainClass = 'proguard.ProGuard'
                def libList = (configurations.compileClasspath.files + configurations.runtimeClasspath.files) as List
            def jmods = new File(System.getProperty('java.home'), 'jmods')
            if (jmods.exists()) libList.add(jmods)
            def libcp = libList.unique().join(File.pathSeparator)
                args = [
                        '-injars', injar.absolutePath,
                        '-outjars', obfJar.get().asFile.absolutePath,
                        '-libraryjars', libcp,
                        '-include', file('proguard.conf').absolutePath
                ]
            }
        }
    }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
